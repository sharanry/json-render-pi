<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Make agent plans easier to understand</title>
  <desc id="desc">A terminal-style comparison showing how json-render for Pi turns dense prose into structured, scannable plans.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151817"/>
      <stop offset="1" stop-color="#1d2320"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="#101312"/>
  <circle cx="1090" cy="70" r="250" fill="#a8d5ba" opacity=".035"/>
  <circle cx="75" cy="625" r="220" fill="#b99be8" opacity=".03"/>

  <g filter="url(#shadow)">
    <rect x="48" y="42" width="1104" height="591" rx="14" fill="url(#bg)" stroke="#38433e"/>
    <path d="M48 96h1104" stroke="#38433e"/>
    <circle cx="79" cy="69" r="6" fill="#df7373"/>
    <circle cx="101" cy="69" r="6" fill="#d8b56b"/>
    <circle cx="123" cy="69" r="6" fill="#83b991"/>
    <text x="600" y="76" text-anchor="middle" fill="#78847e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">json-render for Pi</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="88" y="151" fill="#f2f4f2" font-size="34" font-weight="700">Make agent plans easier to understand.</text>
    <text x="88" y="185" fill="#9aa59f" font-size="18">Turn dense output into a decision surface you can scan in seconds.</text>

    <g transform="translate(88 224)">
      <text x="0" y="0" fill="#737e78" font-size="15" font-weight="700" letter-spacing="1.5">DENSE PROSE</text>
      <rect x="0" y="20" width="440" height="218" rx="8" fill="#181c1a" stroke="#323a36"/>
      <rect x="24" y="49" width="315" height="9" rx="4.5" fill="#68736d" opacity=".58"/>
      <rect x="24" y="75" width="368" height="9" rx="4.5" fill="#68736d" opacity=".42"/>
      <rect x="24" y="101" width="344" height="9" rx="4.5" fill="#68736d" opacity=".5"/>
      <rect x="24" y="127" width="382" height="9" rx="4.5" fill="#68736d" opacity=".35"/>
      <rect x="24" y="153" width="287" height="9" rx="4.5" fill="#68736d" opacity=".45"/>
      <rect x="24" y="179" width="356" height="9" rx="4.5" fill="#68736d" opacity=".32"/>
      <text x="24" y="216" fill="#d07b82" font-size="15">scope and risk hide in the transcript</text>
    </g>

    <g transform="translate(566 224)">
      <text x="0" y="0" fill="#a8d5ba" font-size="15" font-weight="700" letter-spacing="1.5">STRUCTURED JSON UI</text>
      <rect x="0" y="20" width="498" height="218" rx="8" fill="#1a201d" stroke="#709b82"/>

      <text x="24" y="55" fill="#f2f4f2" font-size="18" font-weight="700">Implementation plan</text>
      <rect x="363" y="38" width="109" height="26" rx="13" fill="#24382d"/>
      <circle cx="381" cy="51" r="5" fill="#89c49b"/>
      <text x="394" y="56" fill="#b9dec5" font-size="13">ready</text>
      <path d="M24 79h448" stroke="#36423c"/>

      <text x="24" y="111" fill="#85918b" font-size="14">SCOPE</text>
      <text x="154" y="111" fill="#f2f4f2" font-size="15">3 files · 2 components</text>
      <text x="24" y="145" fill="#85918b" font-size="14">RISK</text>
      <text x="154" y="145" fill="#e0bd72" font-size="15">medium · schema migration</text>
      <text x="24" y="179" fill="#85918b" font-size="14">VERIFY</text>
      <text x="154" y="179" fill="#f2f4f2" font-size="15">tests · typecheck · visual review</text>

      <rect x="24" y="198" width="448" height="7" rx="3.5" fill="#2d3832"/>
      <rect x="24" y="198" width="327" height="7" rx="3.5" fill="#8fc4a0"/>
      <text x="447" y="226" text-anchor="end" fill="#9eaaa4" font-size="13">73%</text>
    </g>

    <g transform="translate(88 510)">
      <g>
        <text x="0" y="0" fill="#a8d5ba" font-size="18" font-weight="700">Stable hierarchy</text>
        <text x="0" y="27" fill="#929d97" font-size="15">Important facts come first.</text>
      </g>
      <g transform="translate(360 0)">
        <text x="0" y="0" fill="#a8d5ba" font-size="18" font-weight="700">Explicit boundaries</text>
        <text x="0" y="27" fill="#929d97" font-size="15">Scope and risk stay visible.</text>
      </g>
      <g transform="translate(738 0)">
        <text x="0" y="0" fill="#a8d5ba" font-size="18" font-weight="700">Earlier review</text>
        <text x="0" y="27" fill="#929d97" font-size="15">Catch complexity before code.</text>
      </g>
    </g>

    <text x="88" y="596" fill="#b99be8" font-size="16" font-weight="700">[ skill ]</text>
    <text x="179" y="596" fill="#d6dbd8" font-size="16">json-ui</text>
    <text x="1040" y="596" text-anchor="end" fill="#75817b" font-size="14">inline · read-only · built for Pi</text>
  </g>
</svg>
